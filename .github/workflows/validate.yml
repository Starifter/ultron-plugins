name: validate

# Every entry is read the way Ultron reads it - manifest parsed, nothing
# imported - and has to pass scripts/validate.py. That check is the whole of
# what this marketplace promises about a plugin.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/Starifter/ultron.git"
      - run: python scripts/validate.py
